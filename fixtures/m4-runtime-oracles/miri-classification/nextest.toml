experimental = ["wrapper-scripts"]

[store]
dir = "/junit"

[scripts.wrapper.miri-muted]
command = { command-line = "/usr/bin/env", env = { MIRIFLAGS = "--error-format=json -Zmiri-isolation-error=abort -Zmiri-backtrace=0 -Zmiri-mute-stdout-stderr" } }
target-runner = "within-wrapper"

[profile.rust-mcp-miri]
fail-fast = false
retries = 0
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.rust-mcp-miri.junit]
path = "reports/junit.xml"
store-success-output = false
store-failure-output = true
report-skipped = "all"

[[profile.rust-mcp-miri.scripts]]
filter = "all()"
run-wrapper = "miri-muted"
