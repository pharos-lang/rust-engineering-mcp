[package]
name = "rust-mcp-profile-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "rust-mcp-profile-helper"
path = "src/main.rs"

[dependencies]
libc = { version = "=0.2.189", default-features = false }

[workspace]
resolver = "3"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
