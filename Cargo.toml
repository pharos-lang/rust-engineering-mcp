[workspace]
exclude = ["vendor/lancedb"]
members = [
    "crates/artifact-adapter",
    "crates/semantic-adapter",
    "crates/catalog-adapter",
    "crates/mcp-server",
    "crates/domain",
    "crates/application",
    "crates/project-adapter",
    "crates/execution-adapter",
]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"
authors = ["IUMotion Labs"]
repository = "https://github.com/pharos-lang/rust-engineering-mcp"

[workspace.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
ring = "=0.17.14"
zstd = { version = "=0.13.3", default-features = false }
rustsec = { version = "=0.32.0", default-features = false }
cargo-lock = { version = "=11.0.1", default-features = false }
base64 = "=0.22.1"
rust-engineering-artifact = { path = "crates/artifact-adapter" }
rust-engineering-semantic = { path = "crates/semantic-adapter" }
lancedb = { version = "=0.31.0", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24"] }
fastembed = { version = "=6.0.2", default-features = false }
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
futures = "=0.3.34"

unicode-ident = "=1.0.24"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize", "limits", "hooks", "cache"] }
rust-engineering-catalog = { path = "crates/catalog-adapter" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "io-util", "signal"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
rust-engineering-domain = { path = "crates/domain" }
rust-engineering-application = { path = "crates/application" }
rust-engineering-project = { path = "crates/project-adapter" }
rust-engineering-execution = { path = "crates/execution-adapter" }
rustix = { version = "=1.1.4", features = ["fs", "system", "process"] }
getrandom = "=0.4.3"
sha2 = "=0.11.0"
toml = { version = "=0.9.12", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse", "display"] }
schemars = "=1.2.2"
semver = "=1.0.28"
jsonschema = { version = "=0.53.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
lancedb = { path = "vendor/lancedb" }
