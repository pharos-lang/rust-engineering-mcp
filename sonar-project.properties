sonar.projectKey=pharos-lang_rust-engineering-mcp
sonar.organization=iumotion-labs
sonar.sources=crates,scripts
sonar.tests=crates,scripts
sonar.exclusions=crates/**/tests/**,crates/**/test-certs/**,scripts/test-*.py,scripts/test-*.sh
sonar.test.inclusions=crates/**/tests/**/*.rs,scripts/test-*.py,scripts/test-*.sh
sonar.test.exclusions=crates/**/tests/fixtures/**,crates/**/tests/snapshots/**
sonar.sourceEncoding=UTF-8
sonar.rust.lcov.reportPaths=coverage/rust.lcov
sonar.python.coverage.reportPaths=coverage/python.xml
# Each exclusion is explicit and remains in static analysis. Native-only paths
# retain their separate qualification receipts (docs/ci.md). Files with portable
# tests or CLI paths are measured even when other branches require Docker/macOS.
# scripts/test-gate-reporting.py prevents re-excluding the portable product paths
# identified by the M4 prerequisite review. This configuration is source-bound.
sonar.coverage.exclusions=scripts/codex-model-qualifier.py,scripts/release-artifact.py,scripts/release-smoke.py,scripts/verify-vendor.py,scripts/probe-m2-cargo-fix.py,scripts/probe-m2-fix-socket-mask.py,scripts/probe-m2-guest-staging.py,scripts/probe-m2-offline-registry.py,scripts/probe-m2-vendor-data.py,scripts/probe-m2-write-primitives.py,scripts/m3-inspector-session.mjs
sonar.python.version=3.11,3.12,3.13,3.14
sonar.plsql.file.suffixes=plsql
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
