sonar.projectKey=pharos-lang_rust-engineering-mcp
sonar.organization=iumotion-labs
sonar.sources=crates,scripts
sonar.tests=crates,scripts
# scripts/lib/ holds support code imported only by the client-qualification
# harnesses (scripts/test-m*-clients*.py); like those harnesses it is test code.
sonar.exclusions=crates/**/tests/**,crates/**/test-certs/**,scripts/test-*.py,scripts/test-*.sh,scripts/lib/**
sonar.test.inclusions=crates/**/tests/**/*.rs,crates/execution-adapter/src/miri_native.rs,crates/execution-adapter/src/security_graph_native.rs,crates/execution-adapter/src/security_native.rs,crates/execution-adapter/src/security_native_adversarial.rs,crates/execution-adapter/src/unsafe_native.rs,crates/execution-adapter/src/performance_native.rs,crates/execution-adapter/src/analyzer_native.rs,scripts/test-*.py,scripts/test-*.sh,scripts/lib/**
sonar.test.exclusions=crates/**/tests/fixtures/**,crates/**/tests/snapshots/**
sonar.sourceEncoding=UTF-8
sonar.rust.lcov.reportPaths=coverage/rust.lcov
sonar.python.coverage.reportPaths=coverage/python.xml
# Each exclusion is explicit and remains in static analysis. Native-only paths
# retain their separate qualification receipts (docs/development/testing.md;
# historical receipt: docs/ci.md at 51fa602e). Files with portable
# tests or CLI paths are measured even when other branches require Docker/macOS.
# scripts/test-gate-reporting.py prevents re-excluding the portable product paths
# identified by the M4 prerequisite review. This configuration is source-bound.
sonar.coverage.exclusions=scripts/codex-model-qualifier.py,scripts/release-artifact.py,scripts/release-smoke.py,scripts/verify-vendor.py,scripts/m3-inspector-session.mjs,scripts/m4-inspector-session.mjs,scripts/m5-inspector-session.mjs,scripts/m6-inspector-session.mjs,scripts/m8-inspector-session.mjs,scripts/build-m5-runtime.py,scripts/build-m6-runtime.py,scripts/test-m6-runtime.py,scripts/test-m8-clients.py,scripts/measure-m8-performance.py,scripts/soak-m8.py,scripts/test-m8-rollback.py
sonar.python.version=3.11,3.12,3.13,3.14
sonar.plsql.file.suffixes=plsql
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
