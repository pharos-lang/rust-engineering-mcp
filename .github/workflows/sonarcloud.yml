name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarCloud
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Rust coverage toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview
          rustup default 1.98.1
          cargo fetch --locked
          cargo install cargo-llvm-cov --locked --version 0.9.0

      - name: Install Python coverage tooling
        run: python -m pip install --require-hashes -r .github/requirements-coverage.txt

      - name: Generate Rust coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-targets --locked --lcov --output-path coverage/rust.lcov

      - name: Generate Python coverage
        run: |
          export COVERAGE_FILE=coverage/.coverage
          python -m coverage run --branch --source=scripts --omit='scripts/test-*.py' scripts/check-architecture.py
          python -m coverage run --append --branch --source=scripts --omit='scripts/test-*.py' scripts/test-coverage-reports.py
          python -m coverage xml -o coverage/python.xml

      - name: Validate coverage reports
        run: python scripts/check-coverage-reports.py

      - name: Scan and wait for the Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
