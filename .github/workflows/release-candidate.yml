name: Draft release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate-ref:
    name: validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an existing version tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Dispatch this workflow from an existing v* version tag." >&2
            exit 1
          fi

  build:
    name: build / ${{ matrix.target }}
    needs: validate-ref
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rust-engineering-mcp
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: rust-engineering-mcp
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: rust-engineering-mcp.exe
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          versions = {p["version"] for p in metadata["packages"]}
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if versions != {expected}:
              raise SystemExit(f"tag {expected!r} does not match package versions {sorted(versions)!r}")
          PY

      - name: Build core binary
        run: cargo build --release --locked -p rust-engineering-mcp

      - name: Package notices and binary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_NAME: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          stem="rust-engineering-mcp-${RELEASE_TAG}-${TARGET_NAME}"
          mkdir -p "dist/${stem}"
          cp "target/release/${BINARY_NAME}" "dist/${stem}/"
          cp README.md SECURITY.md LICENSE LICENSE-APACHE LICENSE-MIT NOTICE "dist/${stem}/"
          tar -czf "dist/${stem}.tar.gz" -C dist "${stem}"
          rm -rf "dist/${stem}"
          python - "dist/${stem}.tar.gz" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.with_suffix(path.suffix + ".sha256").write_text(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          python - <<'PY'
          import hashlib, pathlib
          archives = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          if len(archives) != 3:
              raise SystemExit(f"expected three archives, found {len(archives)}")
          for archive in archives:
              checksum = archive.with_suffix(archive.suffix + ".sha256").read_text().split()[0]
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if checksum != actual:
                  raise SystemExit(f"checksum mismatch: {archive}")
          PY

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag --draft --prerelease
          --title "$RELEASE_TAG" --generate-notes
