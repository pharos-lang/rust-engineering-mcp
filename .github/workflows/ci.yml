name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  portable:
    name: portable / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Provision locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

      - name: Check architectural dependency boundaries
        run: python scripts/check-architecture.py

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Provision locked dependencies
        run: cargo fetch --locked

      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo install cargo-deny --locked --version 0.19.7

      - name: Audit resolved dependencies
        run: cargo audit

      - name: Enforce dependency policy
        run: >-
          cargo deny --all-features --locked --offline check
          --disable-fetch --hide-inclusion-graph advisories bans sources
