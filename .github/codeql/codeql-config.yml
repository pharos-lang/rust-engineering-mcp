name: Rust Engineering MCP

queries:
  - uses: security-extended

paths:
  - crates
  - scripts
  - .github/workflows
  - docs/release/reproduction
  - fixtures/rust-runtime

paths-ignore:
  - "vendor/**"
  - "docs/research/**"
  - "docs/validation/**"
  - "crates/**/tests/**"
  - "crates/**/tests.rs"
  - "scripts/test-*.py"
  - "docs/release/reproduction/**/test*.py"
