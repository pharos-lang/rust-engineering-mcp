[package]
name = "rust-mcp-unsafe-scanner-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "rust-mcp-unsafe-helper"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
syn = { version = "=3.0.4", default-features = false, features = ["full", "parsing", "visit"] }

[workspace]
resolver = "3"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
