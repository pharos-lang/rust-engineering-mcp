[package]
name = "m1-16-trusted-driver"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "process", "io-util", "io-std", "time", "signal", "sync", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rust-engineering-domain = { path = "../../crates/domain" }
rust-engineering-application = { path = "../../crates/application" }
rust-engineering-execution = { path = "../../crates/execution-adapter" }
rust-engineering-catalog = { path = "../../crates/catalog-adapter" }
ring = "=0.17.14"
zstd = { version = "=0.13.3", default-features = false }
